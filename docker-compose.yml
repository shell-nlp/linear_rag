version: '3.8'

services:
  linear-rag:
    build:
      context: .
      dockerfile: Dockerfile.copy
    image: linear-rag:latest
    container_name: linearrag-service

    # 对应 --network host
    # 注意：使用 host 模式后，ports 映射会被忽略，容器直接使用 12124 端口
    network_mode: "host"
    
    # 对应 --restart always
    restart: always
    
    # 对应 --gpus all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # 环境变量配置
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # SkyWalking 配置
      - SW_AGENT_NAME=linearrag-service
      - SW_AGENT_COLLECTOR_BACKEND_SERVICES=192.168.102.22:11807
      - SW_AGENT_PROTOCOL=grpc
      - SW_AGENT_LOGGING_LEVEL=INFO
      # LLM 配置
      - LLM_API_KEY=sk
      - LLM_BASE_URL=http://192.168.102.19:8082/v1
      - LLM_MODEL_NAME=qwen3
      # 嵌入模型配置
      - EMBEDDING_API_URL=http://192.168.102.19:8082/v1/embeddings
      - EMBEDDING_MODEL_NAME=qwen3-embedding
      - embdding_dim=1024
      - SPACY_MODEL=zh_core_web_md
      - MAX_WORKERS=16
      # Neo4j 配置
      - NEO4J_URI=bolt://localhost:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j@2025
      - NEO4J_DATABASE=neo4j
      # MinIO 配置
      - minio_service_addresses=192.168.102.19:9001
      - minio_access_key=minioadmin
      - minio_secret_key=minioadmin
