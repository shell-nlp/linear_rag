version: '3.8'

services:
  linear-rag:
    build:
      context: .
      dockerfile: Dockerfile
    # 镜像名称保持与你之前的习惯接近
    image: linear-rag:latest
    container_name: linearrag-service
    
    # 对应 --network host
    # 注意：使用 host 模式后，ports 映射会被忽略，容器直接使用 12124 端口
    network_mode: "host"
    
    # 对应 --restart always
    restart: always
    
    # 对应 --gpus all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # 环境变量配置
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1