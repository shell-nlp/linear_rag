services:
  linear-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: linear-rag:latest
    container_name: linear-rag
    # 对应 --network host
    # 注意：使用 host 模式后，ports 映射会被忽略，容器直接使用 12125 端口
    # network_mode: "host"
    # 对应 --restart always
    restart: always
    shm_size: "1gb"
    ports:
      - 12125:12125
    # 环境变量配置
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # LLM 配置
      - LLM_API_KEY=sk
      - LLM_BASE_URL=http://192.168.102.19:8082/v1
      - LLM_MODEL_NAME=qwen3
      # 嵌入模型配置
      - EMBEDDING_API_URL=http://192.168.102.19:8082/v1/embeddings
      - EMBEDDING_MODEL_NAME=qwen3-embedding
      - EMBEDDING_DIM=1024
      - SPACY_MODEL=zh_core_web_md
      - MAX_WORKERS=16
      - SPACY_N_PROCESS=1
      # MinIO 配置
      - minio_service_addresses=192.168.102.19:9001
      - minio_access_key=minioadmin
      - minio_secret_key=minioadmin
      # Elasticsearch 配置
      - es_url=http://192.168.102.19:9200
      - es_user=elastic
      - es_password=elastic@2024
    command: ["python", "main.py"]
