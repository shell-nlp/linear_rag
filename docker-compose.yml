version: '3.8'

services:
  hubeirs-rag:
    build:
      context: .
      dockerfile: Dockerfile
    image: hubeirs-rag:latest
    container_name: hubeirs-rag-service
    # 对应 --network host
    # 注意：使用 host 模式后，ports 映射会被忽略，容器直接使用 12125 端口
    # network_mode: "host"
    # 对应 --restart always
    restart: always
    shm_size: "1gb"
    ports:
      - 12125:12125
    # 环境变量配置
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      # LLM 配置
      - LLM_API_KEY=sk
      - LLM_BASE_URL=http://192.168.102.19:8082/v1
      - LLM_MODEL_NAME=qwen3
      # 嵌入模型配置
      - EMBEDDING_API_URL=http://192.168.102.19:8082/v1/embeddings
      - EMBEDDING_MODEL_NAME=qwen3-embedding
      - embdding_dim=1024
      - SPACY_MODEL=zh_core_web_md
      - MAX_WORKERS=16
      - SPACY_N_PROCESS=1
      # Neo4j 配置
      - NEO4J_URI=bolt://192.168.102.19:17687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=neo4j@2025
      - NEO4J_DATABASE=neo4j
      # MinIO 配置
      - minio_service_addresses=192.168.102.19:9001
      - minio_access_key=minioadmin
      - minio_secret_key=minioadmin
      # Elasticsearch 配置
      - es_url=http://192.168.102.19:9200
      - es_user=elastic
      - es_password=elastic@2024
      # Redis 队列
      - REDIS_DB=0
      - REDIS_PASSWORD=admin
      - REDIS_SENTINEL_MASTER=mymaster
      - REDIS_SENTINEL_NODES=192.168.102.21:26379,192.168.102.21:26380,192.168.102.21:26381
      - SERVICE_NAME=python-knowledge-management
      - LOCAL_IP=192.168.102.21
    command: ["sw-python", "run", "python", "main.py"]
